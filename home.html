<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vélodrome — Dirección creativa, diseño y experiencias audiovisuales.">
  <title>Vélodrome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header" id="site-header">
    <nav class="header-left" aria-label="Navegación principal">
      <a href="live.html" class="header-link active" aria-current="page">Live</a>
      <a href="releases.html" class="header-link">Releases</a>
    </nav>

    <a href="index.html" class="header-logo" aria-label="Página de inicio">Vélodrome</a>

    <nav class="header-right" aria-label="Navegación secundaria">
      <a href="archive.html" class="header-link">Archive</a>
      <a href="info.html" class="header-link">Info</a>
    </nav>
  </header>

   <main class="home">
  <button class="showreel-preview" id="open-showreel" type="button" aria-label="Ampliar showreel">
    <video autoplay muted loop playsinline preload="metadata">
      <source src="videos/showreel.mp4" type="video/mp4">
    </video>
  </button>
</main>

<div class="showreel-modal" id="showreel-modal" aria-hidden="true">
  <video class="showreel-video" id="showreel-video" playsinline>
    <source src="videos/showreel.mp4" type="video/mp4">
  </video>

  <div class="video-controls">
    <button id="play-button" type="button">Play</button>
    <button id="sound-button" type="button">Unmute</button>
    <input id="video-progress" type="range" min="0" max="100" value="0" aria-label="Progreso del vídeo">
    <button id="close-showreel" type="button">Close</button>
  </div>
</div>

    </main>

<footer class="footer">
  <p class="footer-copyright">
    ©2026 VÉLODROME. ALL RIGHTS RESERVED
  </p>

  <img
    class="footer-logo"
    src="assets/brand/logo.png"
    alt="LOGO"
  >
</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
